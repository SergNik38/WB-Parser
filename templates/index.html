<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB Parser MVP</title>
    <style>
        /* Reset and Base Styles */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        * {
            box-sizing: border-box;
        }

        /* Container */
        .card {
            background-color: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 1rem;
            width: 100%;
            max-width: 28rem;
            padding: 2rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 1.875rem;
            font-weight: 700;
            background: linear-gradient(to right, #9333ea, #db2777);
            -webkit-background-clip: text;
            color: transparent;
            margin: 0;
        }

        .subtitle {
            color: #6b7280;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.25rem;
        }

        .input {
            width: 100%;
            padding: 0.5rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .input:focus {
            ring: 2px solid #a855f7;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }

        .btn {
            width: 100%;
            background: linear-gradient(to right, #9333ea, #db2777);
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status Area */
        .hidden {
            display: none !important;
        }

        .mt-6 {
            margin-top: 1.5rem;
        }

        /* Loading Spinner */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #4b5563;
        }

        .spinner {
            animation: spin 1s linear infinite;
            height: 2rem;
            width: 2rem;
            color: #9333ea;
            margin-bottom: 0.75rem;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spinner-circle {
            opacity: 0.25;
        }

        .spinner-path {
            opacity: 0.75;
        }

        .loading-text {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }

        /* Success State */
        .success-container {
            text-align: center;
        }

        .success-icon-bg {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 3rem;
            width: 3rem;
            background-color: #d1fae5;
            border-radius: 50%;
            margin-bottom: 1rem;
        }

        .success-icon {
            height: 1.5rem;
            width: 1.5rem;
            color: #059669;
        }

        .success-title {
            font-size: 1.125rem;
            font-weight: 500;
            color: #111827;
            margin: 0;
        }

        .result-text {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.25rem;
            margin-bottom: 1rem;
        }

        .download-btn {
            display: inline-flex;
            items-center;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 0.375rem;
            color: white;
            background-color: #059669;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #047857;
        }

        /* Error State */
        .error-container {
            text-align: center;
            color: #dc2626;
            background-color: #fef2f2;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="header">
            <h1 class="title">WB Parser</h1>
            <p class="subtitle">Парсер товаров Wildberries в Excel</p>
        </div>

        <form id="parseForm">
            <div class="form-group">
                <label for="query" class="label">Поисковый запрос</label>
                <input type="text" id="query" name="query" required class="input"
                    placeholder="Например: iphone 15 чехол">
            </div>

            <div class="form-group">
                <label for="limit" class="label">Количество товаров</label>
                <input type="number" id="limit" name="limit" min="1" max="1000" value="100" class="input">
            </div>

            <button type="submit" id="submitBtn" class="btn">
                <span>Начать сбор данных</span>
            </button>
        </form>

        <!-- Status / Result Area -->
        <div id="statusArea" class="mt-6 hidden">
            <!-- Loading -->
            <div id="loadingState" class="loading-container hidden">
                <svg class="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                    </circle>
                    <path class="spinner-path" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <p>Идет сбор данных...</p>
                <p class="loading-text">Это может занять некоторое время</p>
            </div>

            <!-- Success -->
            <div id="successState" class="success-container hidden">
                <div class="success-icon-bg">
                    <svg class="success-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 class="success-title">Готово!</h3>
                <p id="resultText" class="result-text">Найдено 100 товаров</p>
                <a id="downloadLink" href="#" class="download-btn">
                    Скачать Excel
                </a>
            </div>

            <!-- Error -->
            <div id="errorState" class="error-container hidden">
                <p id="errorText">Произошла ошибка</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('parseForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusArea = document.getElementById('statusArea');
        const loadingState = document.getElementById('loadingState');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const resultText = document.getElementById('resultText');
        const downloadLink = document.getElementById('downloadLink');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Reset
            statusArea.classList.remove('hidden');
            // Hide others first to be safe
            successState.classList.add('hidden');
            errorState.classList.add('hidden');
            // Show loading
            loadingState.classList.remove('hidden');

            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch('/api/parse', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    loadingState.classList.add('hidden');
                    successState.classList.remove('hidden');
                    resultText.textContent = `Найдено ${data.count} товаров`;
                    downloadLink.href = `/api/download/${data.filename}`;
                } else {
                    throw new Error(data.message || 'Unknown error');
                }

            } catch (error) {
                console.error(error);
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                errorText.textContent = `Ошибка: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
